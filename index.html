                                    </div>
                                `).join('')}
                                ${withdrawsList.filter(w => w.status === 'PENDING').length === 0 ? '<p class="text-xs text-slate-500">Sin retiros pendientes.</p>' : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            app.innerHTML = `
                <div>
                    <div class="bg-slate-900/90 backdrop-blur p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl overflow-hidden flex-shrink-0 bg-black">
                                ${LOGO_SVG}
                            </div>
                            <div>
                                <h2 class="text-base font-black text-cyan-400 tracking-wider glow-cyan leading-none mb-0.5">PANEL</h2>
                                <p class="text-[11px] text-slate-300 font-medium truncate max-w-[180px]">${currentUser.email}</p>
                            </div>
                        </div>
                        <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-xs font-bold uppercase">
                            Salir
                        </button>
                    </div>

                    <div class="p-4 space-y-5">
                        <div class="bg-gradient-to-r from-blue-900 via-cyan-900 to-slate-900 rounded-2xl p-5 border border-cyan-500/40 border-glow shadow-xl text-white">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-cyan-300">SALDO DISPONIBLE</p>
                            <h1 class="text-3xl font-black my-1 text-white">$${(currentUser.balance || 0).toLocaleString()} ARS</h1>
                            <div class="flex justify-between items-center mt-3 pt-3 border-t border-cyan-500/20 text-[11px]">
                                <span class="text-slate-300">Saldo Referidos: $${(currentUser.refBalance || 0).toLocaleString()} ARS</span>
                                <span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-full font-bold">Nivel VIP ${currentUser.level || 1}</span>
                            </div>
                        </div>

                        ${mainContent}
                    </div>
                </div>

                <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 flex justify-around py-2.5 text-slate-400 z-50">
                    <button onclick="setView('home')" class="flex flex-col items-center ${currentView === 'home' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">📱</span>
                        <span class="text-[10px] uppercase">Panel</span>
                    </button>
                    <button onclick="setView('referrals')" class="flex flex-col items-center ${currentView === 'referrals' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">👥</span>
                        <span class="text-[10px] uppercase">Referidos</span>
                    </button>
                    <button onclick="setView('recharges')" class="flex flex-col items-center ${currentView === 'recharges' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">💳</span>
                        <span class="text-[10px] uppercase">Cargar</span>
                    </button>
                    <button onclick="setView('withdraws')" class="flex flex-col items-center ${currentView === 'withdraws' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">🏦</span>
                        <span class="text-[10px] uppercase">Retirar</span>
                    </button>
                    ${currentUser.email === ADMIN_EMAIL ? `
                        <button onclick="setView('admin')" class="flex flex-col items-center ${currentView === 'admin' ? 'text-cyan-400 font-bold' : ''}">
                            <span class="text-lg">⚙️</span>
                            <span class="text-[10px] uppercase">Admin</span>
                        </button>
                    ` : ''}
                </div>
            `;

            if (document.getElementById('rechargeForm')) document.getElementById('rechargeForm').onsubmit = handleRechargeSubmit;
            if (document.getElementById('withdrawForm')) document.getElementById('withdrawForm').onsubmit = handleWithdrawSubmit;
            
            startLiveTimers();
        }

        function startLiveTimers() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();

                const checkInEl = document.getElementById('checkin-timer');
                if (checkInEl && currentUser) {
                    const lastTime = currentUser.lastCheckInTimestamp || 0;
                    const rem = (24 * 60 * 60 * 1000) - (now - lastTime);
                    if (rem <= 0) {
                        render();
                    } else {
                        checkInEl.innerText = formatTimeRemaining(rem);
                    }
                }

                const planEls = document.querySelectorAll('.plan-timer');
                planEls.forEach(el => {
                    const end = parseInt(el.getAttribute('data-end'));
                    const rem = end - now;
                    if (rem <= 0) {
                        el.innerText = "¡Completado!";
                    } else {
                        el.innerText = formatTimeRemaining(rem);
                    }
                });
            }, 1000);
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                currentUser = { email: ADMIN_EMAIL, balance: 0, refBalance: 0, isAdmin: true, purchases: {} };
                currentView = 'admin';
                listenToData();
                render();
                return;
            }

            const userRef = db.collection('users').doc(email);
            const doc = await userRef.get();

            if (isRegisterMode) {
                if (doc.exists) return alert('El usuario ya existe');
                const refCodeEntered = (document.getElementById('refCodeInput')?.value || '').trim().toUpperCase();
                const myRefCode = generateRefCode();

                const newUser = {
                    email,
                    password: pass,
                    balance: 0,
                    refBalance: 0,
                    level: 1,
                    purchases: {},
                    activePlans: [],
                    lastCheckInTimestamp: 0,
                    refCode: myRefCode,
                    referredBy: refCodeEntered || null,
                    activeRefsCount: 0,
                    refBonusClaimed: false
                };

                await userRef.set(newUser);
                currentUser = newUser;
            } else {
                if (!doc.exists || doc.data().password !== pass) return alert('Credenciales incorrectas');
                currentUser = doc.data();
            }

            currentView = 'home';
            listenToData();
            render();
        }

        function listenToData() {
            db.collection('users').onSnapshot(snapshot => {
                usersList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (currentUser) {
                    const match = usersList.find(u => u.email === currentUser.email);
                    if (match) currentUser = match;
                }
                render();
            });

            db.collection('recharges').onSnapshot(snapshot => {
                rechargesList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });

            db.collection('withdraws').onSnapshot(snapshot => {
                withdrawsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            render();
        }

        function setView(view) {
            currentView = view;
            render();
        }

        function logout() {
            currentUser = null;
            render();
        }

        async function handleCheckIn() {
            const now = Date.now();
            const lastTime = currentUser.lastCheckInTimestamp || 0;
            if ((now - lastTime) < (24 * 60 * 60 * 1000)) {
                return alert('Debes esperar a que venza el temporizador');
            }

            await db.collection('users').doc(currentUser.email).update({
                balance: (currentUser.balance || 0) + 100,
                lastCheckInTimestamp: now
            });
            alert('¡Recibiste $100 ARS!');
        }

        async function buyProduct(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            const purchases = (currentUser.purchases && currentUser.purchases[productId]) || 0;

            if (purchases >= product.limit) return alert('Límite de compra alcanzado para este plan');
            
            if ((currentUser.balance || 0) < product.price) return alert('Saldo insuficiente para adquirir este plan');

            const activePlans = currentUser.activePlans || [];
            activePlans.push({
                id: product.id,
                name: product.name,
                days: product.days,
                total: product.total,
                boughtAt: Date.now()
            });

            const isFirstPurchase = Object.keys(currentUser.purchases || {}).length === 0;
            const updatedPurchases = { ...(currentUser.purchases || {}), [productId]: purchases + 1 };

            await db.collection('users').doc(currentUser.email).update({
                balance: currentUser.balance - product.price,
                purchases: updatedPurchases,
                activePlans: activePlans
            });

            if (isFirstPurchase && currentUser.referredBy) {
                const referrerDoc = usersList.find(u => u.refCode === currentUser.referredBy);
                if (referrerDoc) {
                    const newActiveCount = (referrerDoc.activeRefsCount || 0) + 1;
                    let newRefBalance = referrerDoc.refBalance || 0;
                    let bonusClaimed = referrerDoc.refBonusClaimed || false;

                    if (newActiveCount >= 10 && !bonusClaimed) {
                        newRefBalance += 5000;
                        bonusClaimed = true;
                    }

                    await db.collection('users').doc(referrerDoc.email).update({
                        activeRefsCount: newActiveCount,
                        refBalance: newRefBalance,
                        refBonusClaimed: bonusClaimed
                    });
                }
            }

            alert(`¡Plan ${product.name} adquirido con éxito!`);
        }

        async function handleRechargeSubmit(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            const proof = document.getElementById('proofUrl').value || 'Sin comprobante';
            if (!amount || amount <= 0) return alert('Monto inválido');
            await db.collection('recharges').add({
                userEmail: currentUser.email,
                amount,
                proofUrl: proof,
                status: 'PENDING',
                date: new Date().toLocaleString()
            });
            alert('Solicitud registrada. Por favor envía tu comprobante por Telegram.');
            setView('home');
        }

        async function handleWithdrawSubmit(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const cbu = document.getElementById('cbuInput').value.trim();
            if (!amount || amount <= 0) return alert('Monto inválido');
            if ((currentUser.balance || 0) < amount) return alert('Saldo insuficiente');

            await db.collection('withdraws').add({
                userEmail: currentUser.email,
                amount,
                cbu,
                status: 'PENDING',
                date: new Date().toLocaleString()
            });

            await db.collection('users').doc(currentUser.email).update({
                balance: currentUser.balance - amount
            });

            alert('Solicitud enviada. Recuerda coordinar por Telegram.');
            setView('home');
        }

        async function setManualBalance(email, inputId) {
            const newBalance = parseFloat(document.getElementById(inputId).value);
            if (isNaN(newBalance)) return alert('Monto inválido');
            await db.collection('users').doc(email).update({ balance: newBalance });
            alert(`Saldo actualizado a $${newBalance} ARS`);
        }

        async function approveRecharge(id, email, amount) {
            const userRef = db.collection('users').doc(email);
            const doc = await userRef.get();
            if (doc.exists) {
                await userRef.update({ balance: (doc.data().balance || 0) + amount });
                await db.collection('recharges').doc(id).update({ status: 'APPROVED' });
                alert('Carga aprobada con éxito');
            }
        }

        async function approveWithdraw(id) {
            await db.collection('withdraws').doc(id).update({ status: 'APPROVED' });
            alert('Retiro completado');
        }

        render();
    </script>
</body>
</html>
