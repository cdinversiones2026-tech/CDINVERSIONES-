                            <div class="space-y-3">
                                ${PRODUCTS.map(p => {
                                    const purchases = (currentUser.purchases && currentUser.purchases[p.id]) || 0;
                                    const limitReached = purchases >= p.limit;
                                    return `
                                        <div class="bg-slate-900/90 p-4 rounded-xl border ${limitReached ? 'border-slate-800 opacity-60' : 'border-slate-800 hover:border-cyan-500/50'} transition-all">
                                            <div class="flex justify-between items-start mb-2">

                                                    <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                                    <p class="text-[11px] text-cyan-300 font-semibold">Plazo: ${p.days} días • Día: $${p.dailyYield.toLocaleString()} ARS</p>
                                                </div>
                                                <span class="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded font-bold">
                                                    Límite: ${purchases}/${p.limit}                                                 </span>                                             </div>                                             <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">                                                 <div>                                                     <p class="text-[10px] text-slate-400 uppercase">Total Retorno</p>                                                     <p class="text-xs font-black text-emerald-400">$${p.total.toLocaleString()} ARS</p>
                                                </div>

                                }).join('')}

                        </div>
                    </div>
                `;
            } else if (currentView === 'recharges') {
                mainContent = `
                    <div class="bg-slate-900/90 p-5 rounded-xl border border-cyan-500/30 border-glow space-y-4">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">CARGAR SALDO</h3>
                        <p class="text-xs text-slate-300">1. Realiza la transferencia al siguiente enlace de Mercado Pago:</p>
                        <a href="${MP_LINK}" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg text-xs uppercase tracking-wider">
                            Pagar con Mercado Pago
                        </a>
                        <form id="rechargeForm" class="space-y-3 pt-3 border-t border-slate-800">
                            <p class="text-xs text-slate-300">2. Ingresa el monto cargado y el comprobante:</p>
                            <input type="number" id="rechargeAmount" required placeholder="Monto ($ ARS)" class="w-full bg-slate-950 text-white p-3 rounded-lg text-xs border border-slate-700">
                            <input type="text" id="proofUrl" placeholder="Link / Detalle del comprobante" class="w-full bg-slate-950 text-white p-3 rounded-lg text-xs border border-slate-700">
                            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black p-3 rounded-lg text-xs uppercase tracking-wider">
                                Confirmar Carga
                            </button>
                        </form>
                    </div>
                `;
            } else if (currentView === 'withdraws') {
                mainContent = `
                    <div class="bg-slate-900/90 p-5 rounded-xl border border-cyan-500/30 border-glow space-y-4">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">RETIRAR SALDO</h3>
                        <form id="withdrawForm" class="space-y-3">
                            <p class="text-xs text-slate-300">Ingresa tu CBU/CVU de Mercado Pago o Banco y el monto a retirar:</p>
                            <input type="number" id="withdrawAmount" required placeholder="Monto a retirar ($ ARS)" class="w-full bg-slate-950 text-white p-3 rounded-lg text-xs border border-slate-700">
                            <input type="text" id="cbuInput" required placeholder="CBU / CVU o Alias de destino" class="w-full bg-slate-950 text-white p-3 rounded-lg text-xs border border-slate-700">
                            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 font-black p-3 rounded-lg text-xs uppercase tracking-wider">
                                Solicitar Retiro
                            </button>
                        </form>
                    </div>
                `;
            } else if (currentView === 'admin' && currentUser.email === ADMIN_EMAIL) {
                mainContent = `
                    <div class="space-y-6">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">PANEL ADMINISTRADOR</h3>
                        
                        <!-- USUARIOS -->
                        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                            <h4 class="font-bold text-white text-xs mb-3 uppercase">Usuarios Registrados (${usersList.length})</h4>
                            <div class="space-y-2 max-h-56 overflow-y-auto">
                                ${usersList.map(u => `
                                    <div class="bg-slate-950 p-2.5 rounded border border-slate-800 flex justify-between items-center text-xs">
                                        <div class="truncate mr-2">
                                            <p class="font-bold text-white truncate">${u.email}</p>                                             <p class="text-cyan-400 text-[11px]">$${(u.balance || 0).toLocaleString()} ARS</p>
                                        </div>
                                        <div class="flex gap-1 flex-shrink-0">
                                            <button onclick="updateUserBalance('${u.email}',${(u.balance || 0) + 1000})" class="bg-emerald-600 text-white px-2 py-1 rounded font-bold text-[10px]">+1000</button>
                                            <button onclick="updateUserBalance('${u.email}',${Math.max(0, (u.balance || 0) - 1000)})" class="bg-red-600 text-white px-2 py-1 rounded font-bold text-[10px]">-1000</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- RECARGAS PENDIENTES -->
                        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                            <h4 class="font-bold text-white text-xs mb-3 uppercase">Solicitudes de Carga</h4>
                            <div class="space-y-2">
                                ${rechargesList.filter(r => r.status === 'PENDING').map(r => `
                                    <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs space-y-1">
                                        <p><strong class="text-white">Usuario:</strong> ${r.userEmail}</p>                                         <p><strong class="text-cyan-400">Monto:</strong> $${r.amount} ARS</p>
                                        <p class="truncate"><strong class="text-slate-400">Comprobante:</strong> ${r.proofUrl}</p>
                                        <button onclick="approveRecharge('${r.id}', '${r.userEmail}',${r.amount})" class="w-full bg-emerald-500 text-slate-950 font-bold p-1.5 rounded text-[11px] mt-1">
                                            Aprobar Carga
                                        </button>
                                    </div>
                                `).join('')}
                                ${rechargesList.filter(r => r.status === 'PENDING').length === 0 ? '<p class="text-xs text-slate-500">Sin cargas pendientes.</p>' : ''}
                            </div>
                        </div>

                        <!-- RETIROS PENDIENTES -->
                        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                            <h4 class="font-bold text-white text-xs mb-3 uppercase">Solicitudes de Retiro</h4>
                            <div class="space-y-2">
                                ${withdrawsList.filter(w => w.status === 'PENDING').map(w => `
                                    <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs space-y-1">
                                        <p><strong class="text-white">Usuario:</strong> ${w.userEmail}</p>                                         <p><strong class="text-cyan-400">Monto:</strong> $${w.amount} ARS</p>
                                        <p><strong class="text-slate-400">CBU/Alias:</strong> ${w.cbu}</p>
                                        <button onclick="approveWithdraw('${w.id}')" class="w-full bg-blue-500 text-slate-950 font-bold p-1.5 rounded text-[11px] mt-1">
                                            Marcar Completado
                                        </button>
                                    </div>
                                `).join('')}
                                ${withdrawsList.filter(w => w.status === 'PENDING').length === 0 ? '<p class="text-xs text-slate-500">Sin retiros pendientes.</p>' : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            // ENCABEZADO "PANEL" Y TARJETA PRINCIPAL
            app.innerHTML = `
                <div>
                    <!-- BARRA SUPERIOR -->
                    <div class="bg-slate-900/90 backdrop-blur p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h2 class="text-xl font-black text-cyan-400 tracking-wider glow-cyan">PANEL</h2>
                            <p class="text-[10px] text-slate-400 truncate max-w-[180px]">${currentUser.email}</p>
                        </div>
                        <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-xs font-bold uppercase">
                            Salir
                        </button>
                    </div>

                    <div class="p-4 space-y-5">
                        <!-- TARJETA SALDO DE ESTILO AZUL/CIAN METÁLICO -->
                        <div class="bg-gradient-to-r from-blue-900 via-cyan-900 to-slate-900 rounded-2xl p-5 border border-cyan-500/40 border-glow shadow-xl text-white">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-cyan-300">SALDO DISPONIBLE</p>
                            <h1 class="text-3xl font-black my-1 text-white">$${(currentUser.balance || 0).toLocaleString()} ARS</h1>
                            <div class="flex justify-between items-center mt-3 pt-3 border-t border-cyan-500/20 text-[11px]">
                                <span class="text-slate-300">Saldo Referidos: $${(currentUser.refBalance || 0).toLocaleString()} ARS</span>
                                <span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-full font-bold">Nivel VIP ${currentUser.level || 1}</span>
                            </div>
                        </div>

                        ${mainContent}
                    </div>
                </div>

                <!-- BARRA INFERIOR DE NAVEGACIÓN -->
                <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 flex justify-around py-3 text-slate-400 z-50">
                    <button onclick="setView('home')" class="flex flex-col items-center ${currentView === 'home' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">📱</span>
                        <span class="text-[10px] uppercase">Panel</span>
                    </button>
                    <button onclick="setView('recharges')" class="flex flex-col items-center ${currentView === 'recharges' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">💳</span>
                        <span class="text-[10px] uppercase">Cargar</span>
                    </button>
                    <button onclick="setView('withdraws')" class="flex flex-col items-center ${currentView === 'withdraws' ? 'text-cyan-400 font-bold' : ''}">
                        <span class="text-lg">🏦</span>
                        <span class="text-[10px] uppercase">Retirar</span>
                    </button>
                    ${currentUser.email === ADMIN_EMAIL ? `
                        <button onclick="setView('admin')" class="flex flex-col items-center ${currentView === 'admin' ? 'text-cyan-400 font-bold' : ''}">
                            <span class="text-lg">⚙️</span>
                            <span class="text-[10px] uppercase">Admin</span>
                        </button>
                    ` : ''}
                </div>
            `;

            if (document.getElementById('rechargeForm')) {
                document.getElementById('rechargeForm').onsubmit = handleRechargeSubmit;
            }
            if (document.getElementById('withdrawForm')) {
                document.getElementById('withdrawForm').onsubmit = handleWithdrawSubmit;
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                currentUser = { email: ADMIN_EMAIL, balance: 0, refBalance: 0, isAdmin: true, purchases: {} };
                currentView = 'admin';
                listenToData();
                render();
                return;
            }

            const userRef = db.collection('users').doc(email);
            const doc = await userRef.get();

            if (isRegisterMode) {
                if (doc.exists) return alert('El usuario ya existe');
                const newUser = { email, password: pass, balance: 0, refBalance: 0, level: 1, purchases: {} };
                await userRef.set(newUser);
                currentUser = newUser;
            } else {
                if (!doc.exists || doc.data().password !== pass) return alert('Credenciales incorrectas');
                currentUser = doc.data();
            }

            currentView = 'home';
            listenToData();
            render();
        }

        function listenToData() {
            db.collection('users').onSnapshot(snapshot => {
                usersList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (currentUser) {
                    const match = usersList.find(u => u.email === currentUser.email);
                    if (match) currentUser = match;
                }
                render();
            });

            db.collection('recharges').onSnapshot(snapshot => {
                rechargesList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });

            db.collection('withdraws').onSnapshot(snapshot => {
                withdrawsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            render();
        }

        function setView(view) {
            currentView = view;
            render();
        }

        function logout() {
            currentUser = null;
            render();
        }

        async function handleCheckIn() {
            const today = new Date().toDateString();
            if (currentUser.lastCheckIn === today) return alert('Ya realizaste el check-in hoy');
            await db.collection('users').doc(currentUser.email).update({
                balance: (currentUser.balance || 0) + 100,
                lastCheckIn: today
            });
            alert('¡Recibiste $100 ARS!');
        }

        async function handleRechargeSubmit(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            const proof = document.getElementById('proofUrl').value || 'Sin comprobante';
            if (!amount || amount <= 0) return alert('Monto inválido');
            await db.collection('recharges').add({
                userEmail: currentUser.email,
                amount,
                proofUrl: proof,
                status: 'PENDING',
                date: new Date().toLocaleString()
            });
            alert('Solicitud de carga enviada al administrador');
            setView('home');
        }

        async function handleWithdrawSubmit(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const cbu = document.getElementById('cbuInput').value.trim();
            if (!amount || amount <= 0) return alert('Monto inválido');
            if ((currentUser.balance || 0) < amount) return alert('Saldo insuficiente');

            await db.collection('withdraws').add({
                userEmail: currentUser.email,
                amount,
                cbu,
                status: 'PENDING',
                date: new Date().toLocaleString()
            });

            await db.collection('users').doc(currentUser.email).update({
                balance: currentUser.balance - amount
            });

            alert('Solicitud de retiro enviada con éxito');
            setView('home');
        }

        async function buyProduct(productId, totalCost) {
            const product = PRODUCTS.find(p => p.id === productId);
            const purchases = (currentUser.purchases && currentUser.purchases[productId]) || 0;

            if (purchases >= product.limit) {
                return alert('Has alcanzado el límite de compra para este producto');
            }

            if ((currentUser.balance || 0) < totalCost) {
                return alert('Saldo insuficiente para adquirir este plan');
            }

            const updatedPurchases = { ...(currentUser.purchases || {}), [productId]: purchases + 1 };

            await db.collection('users').doc(currentUser.email).update({
                balance: currentUser.balance - totalCost,
                purchases: updatedPurchases
            });

            alert(`¡Plan ${product.name} adquirido con éxito!`);
        }

        async function updateUserBalance(email, newBalance) {
            await db.collection('users').doc(email).update({ balance: newBalance });
        }

        async function approveRecharge(id, email, amount) {
            const userRef = db.collection('users').doc(email);
            const doc = await userRef.get();
            if (doc.exists) {
                await userRef.update({ balance: (doc.data().balance || 0) + amount });
                await db.collection('recharges').doc(id).update({ status: 'APPROVED' });
                alert('Carga aprobada con éxito');
            }
        }

        async function approveWithdraw(id) {
            await db.collection('withdraws').doc(id).update({ status: 'APPROVED' });
            alert('Retiro marcado como completado');
        }

        render();
    </script>
</body>
</html>
