        .cd-modal-list span { color: #38bdf8; font-weight: 700; }

        .card-flash { background: linear-gradient(135deg, #1e1b4b, #311042); border: 1px solid #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
        .btn { width: 100%; background: linear-gradient(90deg, #38bdf8, #2563eb); color: #020617; border: none; padding: 12px; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 12px; }

        .nav button.active { color: #38bdf8; font-weight: 800; }

        function formatTimeRemaining(ms) {
            if (ms <= 0) return "00:00:00";
            const totalSecs = Math.floor(ms / 1000);
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function processUserPlans(userObj) {
            if (!userObj || !userObj.activePlans || userObj.activePlans.length === 0 || !db) return false;
            const now = Date.now();
            let updatedPlans = [];
            let finishedPlansList = userObj.finishedPlans || [];
            let totalYield = 0;
            let changed = false;

            userObj.activePlans.forEach(plan => {
                let durationMs = 0;
                if (plan.durationHours) {
                    durationMs = plan.durationHours * 3600 * 1000;
                } else if (plan.days) {
                    durationMs = plan.days * 24 * 3600 * 1000;
                } else {
                    durationMs = 3 * 24 * 3600 * 1000;
                }

                if (now >= (plan.boughtAt + durationMs)) {
                    totalYield += plan.total;
                    finishedPlansList.push({ ...plan, finishedAt: now });
                    changed = true;
                } else {
                    updatedPlans.push(plan);
                }
            });

            if (changed) {
                const newBal = (userObj.balance || 0) + totalYield;
                userObj.balance = newBal;
                userObj.activePlans = updatedPlans;
                userObj.finishedPlans = finishedPlansList;
                db.collection('users').doc(userObj.email).update({
                    balance: newBal,
                    activePlans: updatedPlans,
                    finishedPlans: finishedPlansList
                });
            }
            return changed;
        }

        function checkCompletedPlans() {

            if (currentUser.email === ADMIN_EMAIL) {

                    } else {
                        el.innerText = formatTimeRemaining(rem);

                    const rem = (24 * 3600 * 1000) - (now - (currentUser.lastCheckInTimestamp || 0));

                const witBtn = document.getElementById('btnRetirar');
                const witTimer = document.getElementById('withdraw-timer');
                if (witBtn && currentUser) {
                    const lastWit = currentUser.lastWithdrawTimestamp || 0;

                        witBtn.disabled = false;
                        if (witTimer) witTimer.innerText = "✅ Disponible para retirar";

                }
            }, 1000);

            }

            if (!db) {
                currentUser = { email, balance: 0 };
                currentView = 'home';
                render();
                mostrarAviso();
                return;
            }

            try {
                const ref = db.collection('users').doc(email);
                const doc = await ref.get();

                if (isRegisterMode) {
                    if (doc.exists) return alert('El usuario ya existe');
                    const refCodeEntered = (document.getElementById('refInput')?.value || '').trim().toUpperCase();
                    const newUser = {
                        email, password: pass, balance: 0, refBalance: 0,
                        activePlans: [], finishedPlans: [], lastCheckInTimestamp: 0,
                        lastWithdrawTimestamp: 0,
                        refCode: generateRefCode(), referredBy: refCodeEntered || null
                    };
                    await ref.set(newUser);
                    currentUser = newUser;
                } else {
                    if (!doc.exists || doc.data().password !== pass) return alert('Credenciales incorrectas');
                    currentUser = doc.data();
                    if (!currentUser.refCode) {
                        currentUser.refCode = generateRefCode();
                        await ref.update({ refCode: currentUser.refCode });
                    }
                }

                currentView = 'home';
                listenData();
                render();
                mostrarAviso();
            } catch(e) {
                currentUser = { email, balance: 0 };
                currentView = 'home';
                render();
            }
        }

        function listenData() {
            if (!db) return;
            db.collection('users').onSnapshot(snap => {
                usersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (currentUser && currentUser.email !== ADMIN_EMAIL) {
                    const match = usersList.find(u => u.email === currentUser.email);
                    if (match) currentUser = match;
                }
                checkCompletedPlans();
                render();
            });
            db.collection('recharges').onSnapshot(snap => {
                rechargesList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
            db.collection('withdraws').onSnapshot(snap => {
                withdrawsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
            db.collection('flash_offers').onSnapshot(snap => {
                flashOffersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
            db.collection('bonus_requests').onSnapshot(snap => {
                bonusRequestsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
        }

        async function claimReferralBalance() {
            const hasActivePlan = currentUser.activePlans && currentUser.activePlans.length > 0;
            if (!hasActivePlan) return alert('Debes tener al menos 1 plan activo para poder reclamar tu bono de referidos.');

            const refCode = currentUser.refCode || '';
            const myRefs = usersList.filter(u => refCode && u.referredBy === refCode);
            const refCount = myRefs.length;
            const totalEarned = refCount * REFERRAL_BONUS_PER_USER;

            if (totalEarned <= 0) return alert('No tienes saldo acumulado por referidos.');

            const newBalance = (currentUser.balance || 0) + totalEarned;
            currentUser.balance = newBalance;

            if (db) {
                await db.collection('users').doc(currentUser.email).update({
                    balance: newBalance
                });
            }
            alert(`¡Se transfirieron $${totalEarned.toLocaleString()} ARS de tu bono de referidos al Saldo Principal!`);
            render();
        }

        async function requestMilestoneBonus(count) {
            if (count < 10) return alert('Necesitas 10 referidos para solicitar este bono.');
            if (db) {
                await db.collection('bonus_requests').add({
                    userEmail: currentUser.email,
                    refCount: count,
                    amount: MILESTONE_BONUS_AMOUNT,
                    status: 'PENDING',
                    requestedAt: Date.now()
                });
                alert('¡Solicitud de Bono enviada al administrador!');
                render();
            }
        }

        async function approveMilestoneBonus(reqId, userEmail) {
            if (!db) return;
            const userDoc = await db.collection('users').doc(userEmail).get();
            if (userDoc.exists) {
                const currentBal = userDoc.data().balance || 0;
                await db.collection('users').doc(userEmail).update({
                    balance: currentBal + MILESTONE_BONUS_AMOUNT
                });
                await db.collection('bonus_requests').doc(reqId).update({ status: 'APPROVED' });
                alert(`¡Bono de $5.000 ARS acreditado a ${userEmail}!`);
            }
        }

        async function rejectMilestoneBonus(reqId) {
            if (confirm('¿Rechazar esta solicitud de bono?') && db) {
                await db.collection('bonus_requests').doc(reqId).update({ status: 'REJECTED' });
                alert('Solicitud rechazada.');
            }
        }

        async function handleCreateFlash(e) {
            e.preventDefault();
            const name = document.getElementById('flashName').value.trim();
            const price = parseFloat(document.getElementById('flashPrice').value);
            const total = parseFloat(document.getElementById('flashTotal').value);
            const days = parseInt(document.getElementById('flashDays').value);
            const buyHours = parseFloat(document.getElementById('flashBuyHours').value);

            if (!name || isNaN(price) || isNaN(total) || isNaN(days) || isNaN(buyHours)) {
                return alert('Por favor, completa todos los campos correctamente.');
            }

            const now = Date.now();
            const buyUntil = now + (buyHours * 3600 * 1000);

            if (db) {
                await db.collection('flash_offers').add({
                    name, price, total, days, buyUntil, createdAt: now
                });
                alert('¡Producto Flash publicado con éxito!');
                document.getElementById('flashForm').reset();
            }
        }

        async function deleteFlashOffer(id) {
            if (confirm('¿Eliminar esta oferta flash?') && db) {
                await db.collection('flash_offers').doc(id).delete();
                alert('Oferta eliminada.');
            }
        }

        async function handleCheckIn() {
            const now = Date.now();
            const lastTime = currentUser.lastCheckInTimestamp || 0;
            if ((now - lastTime) < (24 * 3600 * 1000)) return alert('Ya realizaste tu check-in hoy.');

            const newBal = (currentUser.balance || 0) + 100;
            currentUser.balance = newBal;
            currentUser.lastCheckInTimestamp = now;

            if (db) {
                await db.collection('users').doc(currentUser.email).update({
                    balance: newBal,
                    lastCheckInTimestamp: now
                });
            }
            alert('¡Check-in exitoso! Se acreditaron $100 ARS.');
            render();
        }

        async function buyProduct(id) {
            const product = PRODUCTS.find(p => p.id === id);
            if (!product) return;
            if ((currentUser.balance || 0) < product.price) return alert('Saldo insuficiente');
            
            const activePlans = currentUser.activePlans || [];
            const finishedPlans = currentUser.finishedPlans || [];
            const yaComprado = activePlans.some(p => p.id === id) || finishedPlans.some(p => p.id === id);
            if (yaComprado) return alert('Ya has adquirido este producto anteriormente.');

            activePlans.push({ 
                id: product.id, 
                name: product.name, 
                total: product.total, 
                days: product.days || 3,
                isFlash: false,
                boughtAt: Date.now()
            });

            if (db) {
                await db.collection('users').doc(currentUser.email).update({ 
                    balance: currentUser.balance - product.price,
                    activePlans: activePlans
                });
            } else {
                currentUser.balance -= product.price;
                currentUser.activePlans = activePlans;
            }
            alert(`¡Plan ${product.name} adquirido con éxito!`);
            render();
        }

        async function buyFlashProduct(flashId) {
            const flashOffer = flashOffersList.find(f => f.id === flashId);
            if (!flashOffer) return;

            const now = Date.now();
            if (now >= flashOffer.buyUntil) return alert('El tiempo para comprar esta oferta ha expirado.');

            if ((currentUser.balance || 0) < flashOffer.price) return alert('Saldo insuficiente.');

            const activePlans = currentUser.activePlans || [];
            activePlans.push({
                id: flashOffer.id,
                name: flashOffer.name,
                total: flashOffer.total,
                days: flashOffer.days,
                isFlash: true,
                boughtAt: now
            });

            if (db) {
                await db.collection('users').doc(currentUser.email).update({
                    balance: currentUser.balance - flashOffer.price,
                    activePlans: activePlans
                });
            }
            alert(`¡Oferta Flash ${flashOffer.name} adquirida con éxito!`);
            render();
        }

        async function adminAssignPlan() {
            const targetEmail = document.getElementById('adminTargetEmail').value.trim().toLowerCase();
            const planId = parseInt(document.getElementById('adminSelectPlan').value);
            if (!targetEmail) return alert('Ingresa el correo del usuario');

            const product = PRODUCTS.find(p => p.id === planId);
            if (!product) return alert('Plan no válido');

            const targetUser = usersList.find(u => u.email === targetEmail);
            if (!targetUser) return alert('No se encontró un usuario con ese correo.');

            const activePlans = targetUser.activePlans || [];
            activePlans.push({
                id: product.id,
                name: product.name,
                total: product.total,
                days: product.days || 3,
                isFlash: false,
                boughtAt: Date.now()
            });

            if (db) {
                await db.collection('users').doc(targetEmail).update({ activePlans: activePlans });
                alert(`¡Se le asignó el plan ${product.name} a ${targetEmail}!`);
            }
        }

        async function handleRecSubmit(e) {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('recAmt').value);
            const proof = document.getElementById('recProof').value.trim();
            if (db) await db.collection('recharges').add({ userEmail: currentUser.email, amount: amt, proofUrl: proof, status: 'PENDING' });
            alert('Solicitud de recarga enviada.');
            setView('recharges');
        }

        async function solicitarRetiro() {
            const now = Date.now();
            const lastWit = currentUser.lastWithdrawTimestamp || 0;
            if ((now - lastWit) < WITHDRAW_COOLDOWN_MS) return alert('Debes esperar 48 horas desde tu último retiro.');

            const amt = parseFloat(document.getElementById('witAmt').value);
            const cbu = document.getElementById('witCbu').value.trim();
            if (isNaN(amt) || amt < MIN_WITHDRAW) return alert('Monto inválido.');
            if (!cbu) return alert('Ingresa tu CBU/Alias');
            if ((currentUser.balance || 0) < amt) return alert('Saldo insuficiente');

            const comision = amt * WITHDRAW_FEE;
            const montoNeto = amt - comision;

            currentUser.lastWithdrawTimestamp = now;

            if (db) {
                await db.collection('withdraws').add({ userEmail: currentUser.email, amount: amt, netAmount: montoNeto, cbu, status: 'PENDING' });
                await db.collection('users').doc(currentUser.email).update({ 
                    balance: currentUser.balance - amt,
                    lastWithdrawTimestamp: now 
                });
            }
            alert('Retiro solicitado con éxito.');
            setView('withdraws');
        }

        async function saveBal(email, inputId) {
            const val = parseFloat(document.getElementById(inputId).value);
            if (db) await db.collection('users').doc(email).update({ balance: val });
            alert('Saldo actualizado correctamente.');
        }

        async function delUser(email) {
            if (confirm(`¿Estás seguro de eliminar al usuario ${email}?`) && db) {
                await db.collection('users').doc(email).delete();
                alert('Usuario eliminado.');
            }
        }

        async function approveRecharge(id, email, amt) {
            if (!db) return;
            const ref = db.collection('users').doc(email);
            const d = await ref.get();
            if (d.exists) await ref.update({ balance: (d.data().balance || 0) + amt });
            await db.collection('recharges').doc(id).update({ status: 'APPROVED' });
            alert('Carga aprobada con éxito.');
        }

        async function rejectRecharge(id) {
            if (confirm('¿Estás seguro de rechazar esta solicitud de carga?') && db) {
                await db.collection('recharges').doc(id).update({ status: 'REJECTED' });
                alert('Solicitud de carga rechazada.');
            }
        }

        async function approveWithdraw(id) {
            if (db) await db.collection('withdraws').doc(id).update({ status: 'APPROVED' });
            alert('Retiro completado.');
        }

        async function rejectWithdraw(id, email, amt) {
            if (confirm(`¿Rechazar y reembolsar $${amt} ARS al usuario?`) && db) {
                const ref = db.collection('users').doc(email);
                const d = await ref.get();
                if (d.exists) await ref.update({ balance: (d.data().balance || 0) + amt });
                await db.collection('withdraws').doc(id).update({ status: 'REJECTED' });
                alert('Retiro rechazado y dinero reembolsado.');
            }
        }

        initFirebase();
        render();
    </script>
</body>
