<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDINVERSIONES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app" class="max-w-md mx-auto min-h-screen p-4 flex flex-col justify-center items-center">
        <div class="text-center space-y-3">
            <h1 class="text-xl font-bold text-cyan-400">CDINVERSIONES</h1>
            <p class="text-xs text-slate-400">Cargando plataforma...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="w-full bg-slate-900 p-6 rounded-xl border border-cyan-500/30 text-center space-y-4">
                    <h2 class="text-lg font-black text-cyan-400">Panel Oficial</h2>
                    <p class="text-xs text-slate-300">La aplicación está lista. Si ves este mensaje, el sistema cargó correctamente.</p>
                    <button onclick="location.reload()" class="w-full bg-cyan-500 text-slate-950 font-bold p-3 rounded-lg text-xs uppercase">Actualizar Vista</button>
                </div>
            `;
        });
    </script>
</body>
</html>
