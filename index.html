<body class="bg-slate-950 text-slate-100 min-h-screen">

                function getUrlRefCode() {
                    const urlParams = new URLSearchParams(window.location.search);
                    return (urlParams.get('ref') || '').trim().toUpperCase();

                    return 'CD-' + Math.random().toString(36).substring(2, 7).toUpperCase();

                    if (m) m.style.display = "flex";

                    navigator.clipboard.writeText(text).then(() => alert(msg || 'Copiado'));
                };

                window.calcularMontoFinal = function() {
                    const inputMonto = document.getElementById("monto-retiro");
                    const detalleCalculo = document.getElementById("detalle-calculo");
                    if (!inputMonto || !detalleCalculo) return;
                    const monto = parseFloat(inputMonto.value);
                    if (isNaN(monto) || monto <= 0) {
                        detalleCalculo.innerHTML = "Monto neto a recibir: <strong>$0 ARS</strong>";
                        return;
                    }
                    const comision = monto * WITHDRAW_FEE;
                    const neto = monto - comision;
                    detalleCalculo.innerHTML = `Comisión (15%): $${comision.toLocaleString()} ARS | Neto a recibir: <strong class="text-emerald-400">$${neto.toLocaleString()} ARS</strong>`;
                };

                async function initGlobalEventTime() {
                    try {
                        const eventDocRef = db.collection('settings').doc('event24h');
                        const doc = await eventDocRef.get();
                        if (doc.exists) {
                            globalEventStartTime = doc.data().startTime;
                        } else {
                            const now = Date.now();
                            await eventDocRef.set({ startTime: now });
                            globalEventStartTime = now;
                        }
                    } catch (err) {
                        if (!globalEventStartTime) globalEventStartTime = Date.now();
                    }
                }

                window.render = async function() {
                    const app = document.getElementById('app');
                    const autoRefCode = getUrlRefCode();

                    if (autoRefCode && !currentUser && !isRegisterMode) {
                        isRegisterMode = true;
                    }

                    if (!currentUser) {
                        app.className = "max-w-md mx-auto min-h-screen p-4 flex flex-col justify-center items-center";
                        app.innerHTML = `
                            <div class="bg-slate-900/90 p-6 rounded-2xl border border-cyan-500/30 border-glow w-full text-center">

                                <p class="text-slate-400 text-xs mb-6">Plataforma de Inversión Automatizada</p>

                                    </div>
                                    ${isRegisterMode ? `
                                        <div>
                                            <label class="block text-[11px] font-semibold text-cyan-400 uppercase">Código de Referido</label>
                                            <input type="text" id="refCodeInput" value="${autoRefCode}" ${autoRefCode ? 'readonly' : ''} class="w-full bg-slate-950 text-white p-3 rounded-lg border border-cyan-500/50 text-xs font-mono font-bold">
                                        </div>
                                    ` : ''}
                                    <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black p-3 rounded-lg text-xs uppercase tracking-wider mt-2">
                                        ${isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión'}
                                    </button>
                                </form>
                                
                                <div class="mt-5">
                                    <button onclick="toggleAuthMode()" class="text-cyan-400 hover:underline text-xs font-semibold">
                                        ${isRegisterMode ? '¿Ya tienes cuenta? Inicia Sesión' : '¿No tienes cuenta? Regístrate aquí'}
                                    </button>
                                </div>
                            </div>
                        `;
                        document.getElementById('authForm').onsubmit = handleAuth;
                        return;
                    }

                    app.className = "max-w-md mx-auto min-h-screen flex flex-col justify-between relative bg-slate-950 pb-20";
                    let mainContent = '';
                    const now = Date.now();
                    const eventStart = globalEventStartTime || now;
                    const flashLeft = EVENT_DURATION - (now - eventStart);
                    const isFlashActive = flashLeft > 0;

                    if (currentView === 'home') {
                        mainContent = `

                                <div class="grid grid-cols-2 gap-3">

                                    </button>
                                    <button onclick="setView('withdraws')" class="bg-blue-600 hover:bg-blue-500 p-3.5 rounded-xl font-black text-white text-xs uppercase flex items-center justify-center gap-2 shadow-lg">
                                        <span>⬆️</span> Retirar
                                    </button>
                                </div>

                                <div>
                                    <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-3">Planes Disponibles</h3>
                                    <div class="space-y-3">
                                        ${PRODUCTS.map(p => {
                                            if (p.isFlash && !isFlashActive) return '';
                                            const purchases = (currentUser.purchases && currentUser.purchases[p.id]) || 0;
                                            const limitReached = purchases >= p.limit;

                                            return `
                                                <div class="bg-slate-900 p-4 rounded-xl border ${p.isFlash ? 'border-amber-500/80 bg-amber-950/20' : 'border-slate-800'} space-y-2">

                                                        </div>
                                                    </div>
                                                    <button onclick="buyProduct(${p.id})" ${limitReached ? 'disabled' : ''} class="w-full ${limitReached ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black'} py-2 rounded-lg text-xs uppercase">
                                                        ${limitReached ? 'Agotado' : 'Adquirir Plan'}
                                                    </button>
                                                </div>
                                            `;

                                    </div>

                        `;
                    } else if (currentView === 'withdraws') {

                                    <div class="space-y-2 max-h-40 overflow-y-auto">

                                    <p class="text-xs text-slate-300">Total Usuarios: <strong class="text-white">${usersList.length}</strong></p>

                                    <div class="space-y-2 max-h-48 overflow-y-auto">
                                        ${pendingRecharges.map(r => `
                                            <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs space-y-1">
                                                <p class="font-bold text-white break-all">Usuario: ${r.userEmail}</p> <p class="text-cyan-300">Monto: $${r.amount} ARS • Ref: ${r.proofUrl}</p>

                                            </div>
                                        `).join('')}
                                        ${pendingWithdraws.length === 0 ? '<p class="text-xs text-slate-500">Sin retiros pendientes.</p>' : ''}
                                    </div>
                                </div>

                                <!-- Lista de Usuarios para Modificar Saldo -->
                                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                                    <h4 class="text-xs font-bold text-white uppercase">Gestión de Usuarios y Saldos</h4>
                                    <div class="space-y-3 max-h-72 overflow-y-auto">
                                        ${usersList.map(u => `
                                            <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs space-y-2">
                                                <p class="font-bold text-cyan-300 break-all">${u.email}</p> <p class="text-slate-400">Saldo actual: $${(u.balance || 0).toLocaleString()} ARS</p>
                                                <div class="flex gap-2 items-center">
                                                    <input type="number" id="balInput_${u.id}" value="${u.balance || 0}" class="w-full bg-slate-900 text-white p-1.5 rounded text-xs border border-slate-700">
                                                    <button onclick="updateBalance('${u.email}', 'balInput_${u.id}')" class="bg-cyan-500 text-slate-950 font-bold px-3 py-1.5 rounded text-[10px] uppercase">Guardar</button>
                                                    <button onclick="deleteUser('${u.email}')" class="bg-rose-600 text-white font-bold px-2 py-1.5 rounded text-[10px] uppercase">Eliminar</button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    app.innerHTML = `
                        <div>
                            <div class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                                <div>
                                    <h2 class="text-sm font-black text-cyan-400 tracking-wider">PANEL</h2>
                                    <p class="text-[10px] text-slate-300 truncate max-w-[180px]">${currentUser.email}</p>
                                </div>
                                <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-xs font-bold uppercase">Salir</button>
                            </div>

                            <div class="p-4 space-y-4">
                                <div class="bg-gradient-to-r from-blue-900 to-cyan-900 rounded-2xl p-5 border border-cyan-500/40 text-white shadow-xl">
                                    <p class="text-[10px] font-bold uppercase text-cyan-300">SALDO DISPONIBLE</p>
                                    <h1 class="text-3xl font-black my-1">$${(currentUser.balance || 0).toLocaleString()} ARS</h1>
                                </div>
                                ${mainContent}
                            </div>
                        </div>

                        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 flex justify-around py-2.5 text-slate-400 z-50 text-[10px]">
                            <button onclick="setView('home')" class="${currentView === 'home' ? 'text-cyan-400 font-bold' : ''}">📱 Panel</button>
                            <button onclick="setView('referrals')" class="${currentView === 'referrals' ? 'text-cyan-400 font-bold' : ''}">👥 Referidos</button>
                            <button onclick="setView('recharges')" class="${currentView === 'recharges' ? 'text-cyan-400 font-bold' : ''}">💳 Cargar</button>
                            <button onclick="setView('withdraws')" class="${currentView === 'withdraws' ? 'text-cyan-400 font-bold' : ''}">🏦 Retirar</button>
                            ${currentUser.email === ADMIN_EMAIL ? `<button onclick="setView('admin')" class="${currentView === 'admin' ? 'text-cyan-400 font-bold' : ''}">⚙ Admin</button>` : ''}
                        </div>
                    `;

                    const rechargeForm = document.getElementById('rechargeForm');
                    if (rechargeForm) rechargeForm.onsubmit = handleRechargeSubmit;
                };

                window.toggleAuthMode = function() {
                    isRegisterMode = !isRegisterMode;
                    window.render();
                };

                window.setView = function(v) {
                    currentView = v;
                    window.render();
                };

                window.logout = function() {
                    currentUser = null;
                    cerrarAviso();
                    window.render();
                };

                async function handleAuth(e) {
                    e.preventDefault();
                    const email = document.getElementById('emailInput').value.trim().toLowerCase();
                    const pass = document.getElementById('passInput').value;

                    if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                        currentUser = { email: ADMIN_EMAIL, balance: 0, isAdmin: true };
                        currentView = 'admin';
                        await initGlobalEventTime();
                        listenToData();
                        window.render();
                        return;
                    }

                    const userRef = db.collection('users').doc(email);
                    const doc = await userRef.get();
                    await initGlobalEventTime();

                    if (isRegisterMode) {
                        if (doc.exists) return alert('El usuario ya existe');
                        const refCodeEntered = (document.getElementById('refCodeInput')?.value || '').trim().toUpperCase();
                        const newUser = {
                            email,
                            password: pass,
                            balance: 0,
                            refBalance: 0,
                            refCode: generateRefCode(),
                            referredBy: refCodeEntered || null
                        };
                        await userRef.set(newUser);
                        currentUser = newUser;
                    } else {
                        if (!doc.exists || doc.data().password !== pass) return alert('Credenciales incorrectas');
                        currentUser = doc.data();
                    }

                    currentView = 'home';
                    listenToData();
                    window.render();
                    mostrarAviso();
                }

                window.buyProduct = async function(id) {
                    const product = PRODUCTS.find(p => p.id === id);
                    if ((currentUser.balance || 0) < product.price) return alert('Saldo insuficiente');
                    
                    const newBalance = currentUser.balance - product.price;
                    const purchases = currentUser.purchases || {};
                    purchases[id] = (purchases[id] || 0) + 1;

                    await db.collection('users').doc(currentUser.email).update({ 
                        balance: newBalance,
                        purchases: purchases
                    });
                    currentUser.balance = newBalance;
                    currentUser.purchases = purchases;
                    alert(`¡Plan ${product.name} adquirido con éxito!`);
                    window.render();
                };

                async function handleRechargeSubmit(e) {
                    e.preventDefault();
                    const amount = parseFloat(document.getElementById('rechAmount').value);
                    const proof = document.getElementById('rechProof').value.trim();
                    if (isNaN(amount) || amount < MIN_RECHARGE) return alert(`Mínimo de recarga: $${MIN_RECHARGE.toLocaleString()}`);

                    await db.collection('recharges').add({
                        userEmail: currentUser.email,
                        amount,
                        proofUrl: proof,
                        status: 'PENDING',
                        date: new Date().toLocaleString()
                    });
                    alert('Solicitud de recarga enviada con éxito.');
                    window.setView('recharges');
                }

                window.solicitarRetiro = async function() {
                    const monto = parseFloat(document.getElementById('monto-retiro').value);
                    const cbu = document.getElementById('cbuInput').value.trim();

                    if (isNaN(monto) || monto < MIN_WITHDRAW || monto > MAX_WITHDRAW) {
                        return alert(`El retiro debe estar entre $${MIN_WITHDRAW.toLocaleString()} y $${MAX_WITHDRAW.toLocaleString()}`);
                    }
                    if (!cbu) return alert('Ingresa tu CBU o Alias de destino.');
                    if ((currentUser.balance || 0) < monto) return alert('Saldo insuficiente.');

                    const fee = monto * WITHDRAW_FEE;
                    const net = monto - fee;

                    await db.collection('withdraws').add({
                        userEmail: currentUser.email,
                        amount: monto,
                        fee,
                        netAmount: net,
                        cbu,
                        status: 'PENDING',
                        date: new Date().toLocaleString()
                    });

                    await db.collection('users').doc(currentUser.email).update({
                        balance: currentUser.balance - monto
                    });

                    currentUser.balance -= monto;
                    alert('Solicitud de retiro registrada.');
                    window.setView('withdraws');
                };

                window.updateBalance = async function(email, inputId) {
                    const newBal = parseFloat(document.getElementById(inputId).value);
                    if (isNaN(newBal)) return alert('Monto inválido');
                    await db.collection('users').doc(email).update({ balance: newBal });
                    alert('Saldo actualizado correctamente');
                };

                window.deleteUser = async function(email) {
                    if (confirm(`¿Eliminar usuario ${email}?`)) {
                        await db.collection('users').doc(email).delete();
                        alert('Usuario eliminado');
                    }
                };

                window.approveRecharge = async function(id, email, amount) {
                    const uRef = db.collection('users').doc(email);
                    const doc = await uRef.get();
                    if (doc.exists) {
                        const newBal = (doc.data().balance || 0) + amount;
                        await uRef.update({ balance: newBal });
                    }
                    await db.collection('recharges').doc(id).update({ status: 'APPROVED' });
                    alert('Recarga aprobada y acreditada.');
                };

                window.rejectRecharge = async function(id) {
                    await db.collection('recharges').doc(id).update({ status: 'REJECTED' });
                    alert('Recarga rechazada.');
                };

                window.approveWithdraw = async function(id) {
                    await db.collection('withdraws').doc(id).update({ status: 'APPROVED' });
                    alert('Retiro completado.');
                };

                window.rejectWithdraw = async function(id, email, amount) {
                    const uRef = db.collection('users').doc(email);
                    const doc = await uRef.get();
                    if (doc.exists) {
                        const newBal = (doc.data().balance || 0) + amount;
                        await uRef.update({ balance: newBal });
                    }
                    await db.collection('withdraws').doc(id).update({ status: 'REJECTED' });
                    alert('Retiro rechazado y saldo devuelto.');
                };

                function listenToData() {
                    db.collection('users').onSnapshot(snap => {
                        usersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (currentUser) {
                            const match = usersList.find(u => u.email === currentUser.email);
                            if (match) currentUser = match;
                        }
                        window.render();
                    });

                    db.collection('recharges').onSnapshot(snap => {
                        rechargesList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        window.render();
                    });

                    db.collection('withdraws').onSnapshot(snap => {
                        withdrawsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        window.render();
                    });
                }

                initGlobalEventTime().then(() => listenToData());

            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = '<div class="text-rose-400 text-xs text-center p-4">Error al iniciar la aplicación.</div>';
            }
        });
    </script>
</body>
</html>
